<style>
  :root {
    --bg: #fff7ea;
    --card: #ffffff;
    --ink: #2b2b2b;
    --accent: #d7141a;   /* feminine red, the textbook gender colour */
    --muted: #7a7a7a;
    /* Czech textbook gender colours (Czech Step by Step) */
    --g-f:  #d7141a;
    --g-ma: #11457e;
    --g-mi: #4fa3e3;
    --g-n:  #2e9e4f;
    --shadow: 0 6px 18px rgba(80, 50, 20, .12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Nunito", "Segoe UI", "Trebuchet MS", system-ui, sans-serif;
  }
  header {
    padding: 20px 16px 8px;
    text-align: center;
  }
  h1 { margin: 0 0 4px; font-size: 1.9rem; }
  header p { margin: 0 0 12px; color: var(--muted); }
  .controls {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
  }
  .controls button {
    border: 2px solid var(--ink);
    background: var(--card);
    border-radius: 999px;
    padding: 8px 16px;
    font: inherit; font-weight: 700;
    cursor: pointer;
  }
  .controls button[aria-pressed="true"] {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  main { max-width: 1100px; margin: 0 auto; padding: 0 16px 16px; }
  .topic { margin-top: 20px; }
  .topic h2 { font-size: 1.3rem; margin: 0 0 10px 4px; }
  .topic h2 small { color: var(--muted); font-weight: 600; font-size: .95rem; margin-left: 8px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 16px;
  }
  nav.topics {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 10px;
  }
  nav.topics a {
    font-size: .85rem; font-weight: 700; color: var(--ink); text-decoration: none;
    background: #f1e6d4; border-radius: 999px; padding: 4px 10px;
  }
  nav.topics a:hover { background: #e8d8be; }
  .card {
    background: var(--card);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 14px 12px 12px;
    text-align: center;
    cursor: pointer;
    user-select: none;
    transition: transform .12s ease;
    border: 3px solid transparent;
    border-top: 8px solid var(--g, var(--accent));
  }
  .card[data-gender="f"]  { --g: var(--g-f); }
  .card[data-gender="ma"] { --g: var(--g-ma); }
  .card[data-gender="mi"] { --g: var(--g-mi); }
  .card[data-gender="n"]  { --g: var(--g-n); }
  .card:hover { transform: translateY(-3px); }
  .card:active { transform: scale(.98); }
  .card svg {
    width: 100%; height: auto; display: block;
    aspect-ratio: 120 / 100;
  }
  .cs { font-size: 1.7rem; font-weight: 800; margin-top: 8px; color: var(--g, var(--ink)); }
  .en { font-size: 1.05rem; color: var(--muted); font-weight: 700; }
  .card.hide-en:not(.revealed) .en,
  .card.hide-cs:not(.revealed) .cs { visibility: hidden; }
  .card.revealed { border-color: var(--g, var(--accent)); }
  .genders { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .genders button { border: 2px solid var(--c, var(--ink)); background: var(--card); color: var(--c, var(--ink)); border-radius: 999px; padding: 6px 14px; font: inherit; font-weight: 800; cursor: pointer; }
  .genders button[aria-pressed="true"] { background: var(--c, var(--ink)); color: #fff; }
  .genders button:disabled { opacity: .35; cursor: default; }
  .genders .levels { display: inline-flex; gap: 4px; margin-right: 10px; padding-right: 12px; border-right: 2px solid #e8d8be; }
  .genders .levels button { --c: #6b6b6b; padding: 6px 12px; }
  .say {
    margin-top: 8px;
    border: none; background: #f1e6d4; border-radius: 999px;
    width: 40px; height: 40px; font-size: 1.2rem; cursor: pointer;
  }
  .say:hover { background: #e8d8be; }
  footer { text-align: center; color: var(--muted); padding: 12px 16px 28px; font-size: .9rem; line-height: 1.7; }
  footer a { color: var(--ink); }
</style>
</head>
<body>
<header>
  <h1>Česká slovíčka</h1>
  <p>Czech &rarr; English picture cards. Tap a card to reveal a hidden word.</p>
  <div class="controls" role="group" aria-label="Mode">
    <button data-mode="both" aria-pressed="true">Show both</button>
    <button data-mode="hide-en" aria-pressed="false">Hide English</button>
    <button data-mode="hide-cs" aria-pressed="false">Hide Czech</button>
    <button id="shuffle">Shuffle</button>
  </div>
  <div class="genders" role="group" aria-label="Gender" id="genders">
    <span class="levels" role="group" aria-label="Level" id="levels">
      <button data-level="a1" aria-pressed="true">A1</button>
      <button data-level="a2" aria-pressed="false">A2</button>
      <button data-level="all" aria-pressed="false">Vše</button>
    </span>
    <button data-gender="all" aria-pressed="true">Vše</button>
    <button data-gender="ma" style="--c: var(--g-ma)" aria-pressed="false">Ma &middot; mužský životný</button>
    <button data-gender="mi" style="--c: var(--g-mi)" aria-pressed="false">Mi &middot; mužský neživotný</button>
    <button data-gender="f"  style="--c: var(--g-f)"  aria-pressed="false">F &middot; ženský</button>
    <button data-gender="n"  style="--c: var(--g-n)"  aria-pressed="false">N &middot; střední</button>
  </div>
  <nav class="topics" id="topicnav"></nav>
</header>
<main id="deck"></main>
<footer>
  <span id="count"></span> nouns for A1 and A2 Czech &middot; colours follow the textbook convention (Ma dark blue, Mi light blue, F red, N green) &middot; pictures are inline SVG.<br>
  Part of the <a href="https://ilearnczech.com">iLearnCzech</a> family &middot; <a href="https://grammar.ilearnczech.com">Grammar reference</a> &middot; <a href="https://github.com/czech-grammar/nouns">GitHub</a>
</footer>

<script src="words/m-leisure.js"></script>
<script src="words/c-ma-people-a.js"></script>
<script src="words/c-ma-people-b.js"></script>
<script src="words/c-mi-food.js"></script>
<script src="words/c-mi-town.js"></script>
<script src="words/c-mi-misc.js"></script>
<script src="words/c-f-people.js"></script>
<script src="words/c-f-home.js"></script>
<script src="words/c-f-town.js"></script>
<script src="words/c-f-body.js"></script>
<script src="words/c-n-a.js"></script>
<script src="words/c-n-b.js"></script>
<script>
  // Audio is off until pre-recorded clips exist: browser speech voices are
  // missing on many desktops and poor where present. Flip to true to show 🔊.
  const AUDIO = false;

  const TOPICS = [
    ['family',   'Rodina a lidé',        'family and people'],
    ['home',     'Dům a byt',            'home'],
    ['food',     'Jídlo a pití',         'food and drink'],
    ['meals',    'U stolu',              'meals and eating out'],
    ['shopping', 'Nakupování a peníze',  'shopping and money'],
    ['town',     'Město a doprava',      'town and transport'],
    ['travel',   'Cestování a příroda',  'travel and nature'],
    ['animals',  'Zvířata',              'animals'],
    ['time',     'Čas a počasí',         'time and weather'],
    ['body',     'Tělo a zdraví',        'body and health'],
    ['clothes',  'Oblečení',             'clothes'],
    ['school',   'Škola a práce',        'school and work'],
    ['leisure',  'Mluvení a volný čas',  'communication and leisure'],
    ['other',    'Další slova',          'more words'],
  ];
  const deck = document.getElementById('deck');
  // Filters live in the query string so a view can be bookmarked or shared,
  // e.g. ?gender=f&mode=hide-en#t-food
  const MODES = ['both', 'hide-en', 'hide-cs'];
  const GENDERS = ['all', 'ma', 'mi', 'f', 'n'];
  const LEVELS = ['a1', 'a2', 'all'];
  const params = new URLSearchParams(location.search);
  let mode = MODES.includes(params.get('mode')) ? params.get('mode') : 'both';
  let gender = GENDERS.includes(params.get('gender')) ? params.get('gender') : 'all';
  let level = LEVELS.includes(params.get('level')) ? params.get('level') : 'a1';

  // The A2 decks are loaded only when first needed, so the default A1 view stays light.
  const A2_FILES = ["f-body", "f-clothes", "f-family-a", "f-family-b", "f-food", "f-home", "f-leisure", "f-nature", "f-school-a", "f-school-b", "f-shopping", "f-town", "m-clothes", "m-family-a", "m-home-a", "m-home-b", "m-leisure-people", "m-nature", "m-other", "m-people", "m-school", "m-town", "m-travel-body", "n-home", "n-leisure", "n-travel"];
  let a2Loaded = false, a2Loading = null;
  function loadA2() {
    if (a2Loaded) return Promise.resolve();
    if (a2Loading) return a2Loading;
    a2Loading = Promise.all(A2_FILES.map(f => new Promise((ok, fail) => {
      const el = document.createElement('script');
      el.src = 'words/a2/' + f + '.js';
      el.onload = ok; el.onerror = () => fail(f);
      document.head.appendChild(el);
    }))).then(() => { a2Loaded = true; order = WORDS.map((_, i) => i).sort(byGender); });
    return a2Loading;
  }

  function syncUrl() {
    const q = new URLSearchParams();
    if (level !== 'a1') q.set('level', level);
    if (gender !== 'all') q.set('gender', gender);
    if (mode !== 'both') q.set('mode', mode);
    const qs = q.toString();
    history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash);
  }
  // Traditional grammar order: masculine animate, masculine inanimate, feminine, neuter.
  const GENDER_ORDER = { ma: 0, mi: 1, f: 2, n: 3 };
  const byGender = (a, b) => GENDER_ORDER[WORDS[a].gender || 'f'] - GENDER_ORDER[WORDS[b].gender || 'f'];
  let order = WORDS.map((_, i) => i).sort(byGender);

  function makeCard(w) {
    const card = document.createElement('article');
    card.className = 'card ' + (mode === 'both' ? '' : mode);
    card.dataset.gender = w.gender || 'f';
    card.innerHTML = `
      <svg viewBox="0 0 120 100" role="img" aria-label="${w.en}">${w.svg}</svg>
      <div class="cs" lang="cs">${w.cs}</div>
      <div class="en" lang="en">${w.en}</div>
      ${AUDIO ? `<button class="say" aria-label="Say ${w.cs} in Czech">🔊</button>` : ''}`;
    card.addEventListener('click', () => card.classList.toggle('revealed'));
    const sayBtn = card.querySelector('.say');
    if (sayBtn) sayBtn.addEventListener('click', (e) => { e.stopPropagation(); say(w.cs); });
    return card;
  }

  function render() {
    deck.innerHTML = '';
    const nav = document.getElementById('topicnav');
    nav.innerHTML = '';
    const visible = order.filter(i =>
      (gender === 'all' || (WORDS[i].gender || 'f') === gender) &&
      (level === 'all' || (WORDS[i].level || 'A1').toLowerCase() === level));
    for (const [key, cs, en] of TOPICS) {
      const idx = visible.filter(i => (WORDS[i].topic || 'other') === key);
      if (!idx.length) continue;
      const sec = document.createElement('section');
      sec.className = 'topic'; sec.id = 't-' + key;
      sec.innerHTML = `<h2>${cs}<small>${en} &middot; ${idx.length}</small></h2>`;
      const grid = document.createElement('div');
      grid.className = 'grid';
      for (const i of idx) grid.appendChild(makeCard(WORDS[i]));
      sec.appendChild(grid);
      deck.appendChild(sec);
      const a = document.createElement('a');
      a.href = '#t-' + key; a.textContent = cs;
      nav.appendChild(a);
    }
    document.getElementById('count').textContent = visible.length + ' / ' + WORDS.length;
  }

  document.querySelectorAll('#levels button').forEach(btn => {
    const l = btn.dataset.level;
    btn.setAttribute('aria-pressed', String(l === level));
    btn.addEventListener('click', () => {
      level = l;
      document.querySelectorAll('#levels button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
      syncUrl();
      (level === 'a1' ? Promise.resolve() : loadA2()).then(render);
    });
  });

  document.querySelectorAll('#genders > button').forEach(btn => {
    const g = btn.dataset.gender;
    if (g !== 'all' && !WORDS.some(w => (w.gender || 'f') === g)) btn.disabled = true;
    btn.setAttribute('aria-pressed', String(g === gender));
    btn.addEventListener('click', () => {
      gender = g;
      document.querySelectorAll('#genders > button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
      syncUrl();
      render();
    });
  });

  function say(text) {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'cs-CZ';
    u.rate = 0.85;
    const voice = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('cs'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  }

  document.querySelectorAll('[data-mode]').forEach(btn => {
    btn.setAttribute('aria-pressed', String(btn.dataset.mode === mode));
    btn.addEventListener('click', () => {
      mode = btn.dataset.mode;
      document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
      syncUrl();
      render();
    });
  });

  document.getElementById('shuffle').addEventListener('click', () => {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    order.sort(byGender);   // shuffle within each gender, keep Ma, Mi, F, N order
    render();
  });

  (level === 'a1' ? Promise.resolve() : loadA2()).then(() => {
    render();
    if (location.hash) {
      const target = document.querySelector(location.hash);
      if (target) target.scrollIntoView();
    }
  });
</script>
